
services:
  mariadb-mcp:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mariadb-mcp
    restart: unless-stopped

    ports:
      - "9001:9001"

    environment:
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME:-}"
      MCP_READ_ONLY: "${MCP_READ_ONLY:-true}"
      MCP_MAX_POOL_SIZE: "${MCP_MAX_POOL_SIZE:-10}"
      MCP_BLOCK_SENSITIVE_SHOW: "${MCP_BLOCK_SENSITIVE_SHOW:-true}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,10.0.20.189}"

    command:
      - python
      - src/server.py
      - --host
      - 0.0.0.0
      - --transport
      - http
      - --port
      - "9001"
      - --path
      - /mcp
